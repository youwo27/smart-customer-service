[project]
name = "minisupport-agent"
version = "0.1.0"
description = "MiniSupport Agent - 电商客服智能系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "chromadb>=0.5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    # LangChain 0.3.x 全家桶：langchain-core 必须 <1.0（1.x 移除了 langchain_core.memory，
    # 与 langchain 0.3 的 agents 模块不兼容，会 ImportError）。锁死小版本避免 pip 升级踩坑。
    "langchain>=0.3.0,<1.0.0",
    "langchain-core>=0.3.66,<1.0.0",
    "langchain-anthropic>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<1.0.0",
    "openai>=1.0",
    "langgraph>=0.2.0",
    "langchain-chroma>=0.2.0,<1.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "pyyaml>=6.0",
    "pypdf2>=3.0",
    "rank-bm25>=0.2",
    # Day 9：全链路追踪。api 提供 trace/span 抽象与 contextvars 传播，sdk 提供
    # TracerProvider + OTLP exporter，instrumentation-fastapi 给每个 HTTP 请求自动埋根 span。
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
